<title>MTGO Game Replay</title>
<style>
  :root{
    --bg:#13161b; --panel:#1b1f27; --raised:#232a35; --line:#2c3440;
    --ink:#e7eaf0; --muted:#8b93a3; --faint:#5a6472;
    --accent:#d9a441; --accent-dim:#8a6d2e;
    --good:#57a468; --bad:#d0574a;
    --seat0:#4a90d9; --seat1:#d0574a; --seat2:#57a468; --seat3:#c9a24a;
    --chip:#20262f; --chip-line:#333c49;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
    --r:9px;
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#e9e7e1; --panel:#f4f2ec; --raised:#fbfaf6; --line:#d6d2c7;
      --ink:#1f2530; --muted:#5c6472; --faint:#8a91a0;
      --accent:#a9781f; --accent-dim:#b78d3a;
      --chip:#efece3; --chip-line:#d8d3c6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161b; --panel:#1b1f27; --raised:#232a35; --line:#2c3440;
    --ink:#e7eaf0; --muted:#8b93a3; --faint:#5a6472; --accent:#d9a441; --accent-dim:#8a6d2e;
    --chip:#20262f; --chip-line:#333c49;
  }
  :root[data-theme="light"]{
    --bg:#e9e7e1; --panel:#f4f2ec; --raised:#fbfaf6; --line:#d6d2c7;
    --ink:#1f2530; --muted:#5c6472; --faint:#8a91a0; --accent:#a9781f; --accent-dim:#b78d3a;
    --chip:#efece3; --chip-line:#d8d3c6;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh;min-height:0}
  h1,h2,h3{margin:0;font-weight:650;text-wrap:balance}
  button{font:inherit;color:inherit;cursor:pointer}
  .num{font-variant-numeric:tabular-nums}

  /* ── transport bar ── */
  .topbar{display:flex;align-items:center;gap:18px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0}
  .brand .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .brand .g{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .turn{display:flex;align-items:baseline;gap:8px;padding:5px 12px;background:var(--raised);
    border:1px solid var(--line);border-radius:var(--r);white-space:nowrap}
  .turn b{font-size:15px}.turn .ph{color:var(--accent);font-weight:600}
  .turn .who{color:var(--muted);font-size:12px}
  .transport{display:flex;align-items:center;gap:10px;flex:1;min-width:260px}
  .transport input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .tbtn{background:var(--raised);border:1px solid var(--line);border-radius:7px;
    width:34px;height:30px;display:grid;place-items:center;color:var(--ink)}
  .tbtn:hover{border-color:var(--accent-dim)}
  .tick{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;min-width:74px;text-align:right}
  .load{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;
    padding:6px 10px;border:1px dashed var(--line);border-radius:7px}
  .load input{display:none}
  .load:hover{border-color:var(--accent-dim);color:var(--ink)}

  /* ── stage ── */
  .stage{display:grid;grid-template-columns:1fr 320px;gap:0;flex:1;min-height:0}
  .board{overflow-y:auto;padding:14px}
  .players{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .players.duel{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:820px){.stage{grid-template-columns:1fr}.players{grid-template-columns:1fr}}

  /* ── player panel ── */
  .player{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    border-top:3px solid var(--seat);overflow:hidden;display:flex;flex-direction:column}
  .player.act{box-shadow:0 0 0 1px var(--accent), 0 6px 22px -12px var(--accent)}
  .phead{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap;
    background:linear-gradient(180deg,color-mix(in srgb,var(--seat) 14%,var(--panel)),var(--panel))}
  .pname{font-weight:650;font-size:15px;color:var(--seat-ink)}
  .life{font-family:var(--mono);font-weight:700;font-size:20px;margin-left:auto}
  .life.low{color:var(--bad)}
  .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .clock{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .pips{display:inline-flex;gap:3px;align-items:center}
  .pip{width:15px;height:15px;border-radius:50%;font-size:9px;font-weight:700;
    display:grid;place-items:center;border:1px solid rgba(0,0,0,.3)}
  .badge{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:5px;
    background:var(--raised);border:1px solid var(--line);color:var(--muted)}
  .badge.cmd{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
  .statusbadge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:5px}
  .statusbadge.won{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good);border:1px solid var(--good)}
  .statusbadge.lost{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad);border:1px solid var(--bad)}
  .player.dead{opacity:.5;filter:grayscale(.45)}

  .battlefield{padding:8px 10px;display:flex;flex-direction:column;gap:7px}
  .cgroup{display:flex;flex-wrap:wrap;gap:6px}
  .cgroup .gl{width:100%;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-bottom:-2px}
  .card{display:inline-flex;align-items:center;gap:6px;max-width:100%;
    background:var(--chip);border:1px solid var(--chip-line);border-left:3px solid var(--seat);
    border-radius:7px;padding:3px 7px;font-size:12.5px}
  .card.tap{opacity:.62;font-style:italic}
  .card .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .card .pt{font-family:var(--mono);font-weight:700;font-size:11.5px;color:var(--accent)}
  .card .fl{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .card.attk{border-color:var(--bad)}
  .card.blk{border-color:var(--seat0)}
  .empty{color:var(--faint);font-size:12px;font-style:italic;padding:2px 0}

  .zoneline{padding:6px 12px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .zoneline b{color:var(--ink);font-weight:600}
  .zoneline .zn{color:var(--faint)}

  .stack{margin:0 14px 14px;background:var(--panel);border:1px solid var(--accent-dim);
    border-radius:var(--r);padding:8px 12px}
  .stack h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .stack .s{font-size:12.5px;padding:2px 0}

  /* ── log rail ── */
  .logpane{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .logpane h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    padding:11px 14px 7px}
  .log{overflow-y:auto;padding:0 14px 14px;font-family:var(--mono);font-size:12px;line-height:1.5;flex:1}
  .log .ln{padding:2px 0;color:var(--faint);border-left:2px solid transparent;padding-left:9px;margin-left:-9px}
  .log .ln.past{color:var(--ink)}
  .log .ln.now{color:var(--ink);border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .log .ln .cn{color:var(--accent)}
  .result{margin:8px 14px 14px;padding:10px 12px;border:1px solid var(--accent);border-radius:var(--r);
    background:color-mix(in srgb,var(--accent) 10%,transparent);font-size:13px}
  .result b{color:var(--accent)}

  .hint{position:fixed;bottom:10px;left:16px;font-size:11px;color:var(--faint)}
  .hint kbd{font-family:var(--mono);background:var(--raised);border:1px solid var(--line);
    border-radius:4px;padding:0 4px}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="k">MTGO Replay</span>
      <span class="g" id="gtitle">—</span>
    </div>
    <div class="turn"><b class="num" id="turn">—</b><span class="ph" id="phase"></span><span class="who" id="who"></span></div>
    <div class="transport">
      <button class="tbtn" id="prev" title="Previous tick (←)">‹</button>
      <button class="tbtn" id="play" title="Play / pause (space)">▶</button>
      <button class="tbtn" id="next" title="Next tick (→)">›</button>
      <input type="range" id="slider" min="0" max="0" value="0" />
      <span class="tick" id="tick">0 / 0</span>
    </div>
    <label class="load">Load .ndjson<input type="file" id="file" accept=".ndjson,.json,.jsonl,.txt" /></label>
  </header>

  <div class="stage">
    <div class="board">
      <div class="stack" id="stack" hidden></div>
      <div class="players" id="players"></div>
    </div>
    <aside class="logpane">
      <h2>Play-by-play</h2>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>
<div class="hint"><kbd>←</kbd> <kbd>→</kbd> step · <kbd>space</kbd> play · scrub the slider to any tick</div>

<script type="application/x-ndjson" id="sample"></script>
<script>
(function(){
  "use strict";
  const SEAT=["--seat0","--seat1","--seat2","--seat3"];
  const SEAT_HEX={ "--seat0":"#4a90d9","--seat1":"#d0574a","--seat2":"#57a468","--seat3":"#c9a24a" };
  const PIP={W:"#f3edd6",U:"#5a9bd8",B:"#8d7fa0",R:"#d0674f",G:"#63ab74",C:"#b9bcc4"};

  let header=null, states=[], logs=[], overlays=[], result=null, idx=0, playing=false, timer=null;

  const $=id=>document.getElementById(id);

  function parse(text){
    header=null; states=[]; logs=[]; overlays=[]; result=null;
    let ord=0;
    for(const raw of text.split(/\r?\n/)){
      const line=raw.trim(); if(!line) continue;
      let r; try{ r=JSON.parse(line); }catch{ continue; }
      r._ord=ord++;
      if(r.type==="header") header=r;
      else if(r.type==="state") states.push(r);
      else if(r.type==="log") logs.push(r);
      else if(r.type==="players") overlays.push(r);   // live status / commander damage
      else if(r.type==="result") result=r;
    }
    idx=0;
  }

  // latest live-overlay at or before a given file ordinal -> {index:{status,eliminated,commanderDamage}}
  function overlayAt(ord){
    let chosen=null;
    for(const o of overlays){ if(o._ord<=ord) chosen=o; else break; }
    const m={};
    if(chosen) for(const p of chosen.players) m[p.index]=p;
    return m;
  }

  // strip MTGO markup: @[Name@:id,id:@] -> Name ; leading @P
  function clean(t){
    if(!t) return "";
    return t.replace(/@\[([^@]*)@:[^\]]*\]/g,"$1").replace(/@P/g,"").replace(/@\{[^}]*\}/g,"").trim();
  }

  function seatVars(el,i){
    const key=SEAT[i%4];
    el.style.setProperty("--seat", `var(${key})`);
    el.style.setProperty("--seat-ink", SEAT_HEX[key]);
  }

  function manaPips(mana){
    if(!mana) return "";
    const frag=document.createElement("span"); frag.className="pips";
    for(const sym of Object.keys(mana)){
      const letters=(sym.match(/[WUBRGC]/g)||["C"]);
      const n=mana[sym];
      for(let k=0;k<n;k++){ const L=letters[0];
        const p=document.createElement("span"); p.className="pip";
        p.style.background=PIP[L]||PIP.C; p.style.color="#1a1a1a"; p.textContent=L; frag.appendChild(p);
      }
    }
    return frag;
  }

  function cardChip(c, ci){
    const el=document.createElement("span");
    el.className="card"+(c.tapped?" tap":"")+(c.attacking?" attk":"")+(c.blocking?" blk":"");
    el.style.setProperty("--seat", `var(${SEAT[(c.controller??ci)%4]})`);
    const nm=document.createElement("span"); nm.className="cn"; nm.textContent=c.name||"?"; el.appendChild(nm);
    if(c.power!=null){ const pt=document.createElement("span"); pt.className="pt"; pt.textContent=`${c.power}/${c.toughness}`; el.appendChild(pt); }
    if(c.loyalty!=null){ const pt=document.createElement("span"); pt.className="pt"; pt.textContent=`◆${c.loyalty}`; el.appendChild(pt); }
    const marks=[];
    if(c.damage!=null) marks.push(`${c.damage}dmg`);
    if(c.chapter!=null) marks.push(`ch${c.chapter}`);
    if(c.counters) for(const k in c.counters) marks.push(`${shortCtr(k)}×${c.counters[k]}`);
    if(c.tapped) marks.push("↷");
    if(c.summoningSick) marks.push("~");
    if(c.faceDown) marks.push("face-down");
    if(c.token) marks.push("token");
    if(c.attachedToName) marks.push("on "+c.attachedToName);
    if(c.blocks && c.blocks.length) marks.push("blocks "+c.blocks.join(", "));
    if(c.targets && c.targets.length) marks.push("→ "+c.targets.join(", "));
    if(marks.length){ const f=document.createElement("span"); f.className="fl"; f.textContent=marks.join(" · "); el.appendChild(f); }
    el.title=(c.type||"")+(c.faceDown?" (face-down)":"");
    return el;
  }
  function shortCtr(k){ return k.replace("PlusOnePlusOne","+1/+1").replace("MinusOneMinusOne","-1/-1").replace("Loyalty","loy"); }

  function typeBucket(c){
    const t=(c.type||"").toLowerCase();
    if(t.includes("creature")) return 0;
    if(t.includes("planeswalker")) return 1;
    if(t.includes("land")) return 3;
    return 2;
  }
  const BUCKET=["Creatures","Planeswalkers","Other","Lands"];

  function render(){
    if(!states.length){ $("gtitle").textContent="Load a recording to begin"; return; }
    const s=states[idx];
    const names={}; (s.players||[]).forEach(p=>names[p.index]=p.name);
    const ov=overlayAt(s._ord);
    $("gtitle").textContent = header ? header.players.map(p=>p.name).join("  vs  ") : "game";
    $("turn").textContent = "Turn "+s.turn;
    $("phase").textContent = s.phase||"";
    const dnStr = s.dayNight ? (s.dayNight==="night"?"☾ Night":"☀ Day") : "";
    $("who").textContent = (dnStr?dnStr+" · ":"") + (s.prompt ? clean(s.prompt) : "");
    $("tick").textContent = (idx+1)+" / "+states.length;
    $("slider").value = idx;

    // bucket cards by controller (battlefield) / owner (graveyard,exile) / stack
    const bf={}, gy={}, ex={}, stack=[];
    for(const c of s.cards){
      const z=c.zone||"";
      if(z==="Battlefield"){ (bf[c.controller]=bf[c.controller]||[]).push(c); }
      else if(z==="Graveyard"){ (gy[c.owner]=gy[c.owner]||[]).push(c); }
      else if(z==="Exile"){ (ex[c.owner]=ex[c.owner]||[]).push(c); }
      else if(z==="Stack"){ stack.push(c); }
    }

    // stack
    const st=$("stack");
    if(stack.length){ st.hidden=false; st.innerHTML="<h3>Stack · resolves top-down</h3>";
      stack.forEach(c=>{ const d=document.createElement("div"); d.className="s";
        let txt=(names[c.controller]||"?")+": "+(c.name||"?")+(c.type?" — "+c.type:"");
        if(c.targets && c.targets.length) txt+="  → "+c.targets.join(", ");
        d.textContent=txt; st.appendChild(d); });
    } else st.hidden=true;

    // players
    const wrap=$("players"); wrap.innerHTML="";
    const ps=(s.players||[]).slice().sort((a,b)=>a.index-b.index);
    wrap.className="players"+(ps.length<=2?" duel":"");
    ps.forEach((p,pi)=>{
      const info=ov[p.index];
      const panel=document.createElement("div"); panel.className="player";
      if(s.promptedPlayer===p.index) panel.classList.add("act");
      if(info && (info.eliminated || info.status==="HasLost")) panel.classList.add("dead");
      seatVars(panel,p.index);

      const head=document.createElement("div"); head.className="phead";
      const nm=document.createElement("span"); nm.className="pname"; nm.textContent=p.name; head.appendChild(nm);
      if(info && info.status){ const sb=document.createElement("span");
        sb.className="statusbadge "+(info.status==="HasWon"?"won":"lost");
        sb.textContent=info.status==="HasWon"?"WON":(info.status==="HasLost"?"LOST":info.status); head.appendChild(sb); }
      const cnt=document.createElement("span"); cnt.className="cnt num";
      cnt.textContent=`hand ${p.hand} · lib ${p.library} · gy ${p.graveyard}`; head.appendChild(cnt);
      if(p.counters){ for(const k in p.counters){ const b=document.createElement("span"); b.className="badge";
        b.textContent=`${k} ${p.counters[k]}`; head.appendChild(b);} }
      if(info && info.commanderDamage){ for(const k in info.commanderDamage){ const b=document.createElement("span"); b.className="badge cmd";
        b.textContent=`cmdr dmg ${info.commanderDamage[k]}`; head.appendChild(b);} }
      const pips=manaPips(p.mana); if(pips) head.appendChild(pips);
      if(p.clockSeconds){ const cl=document.createElement("span"); cl.className="clock num";
        const m=Math.floor(p.clockSeconds/60), sec=p.clockSeconds%60; cl.textContent=`${m}:${String(sec).padStart(2,"0")}`; head.appendChild(cl);}
      const life=document.createElement("span"); life.className="life num"+(p.life<=5?" low":""); life.textContent=p.life; head.appendChild(life);
      panel.appendChild(head);

      const field=document.createElement("div"); field.className="battlefield";
      const perms=(bf[p.index]||[]);
      if(!perms.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="— no permanents —"; field.appendChild(e); }
      else{
        const groups=[[],[],[],[]];
        perms.forEach(c=>groups[typeBucket(c)].push(c));
        groups.forEach((g,bi)=>{ if(!g.length) return;
          const row=document.createElement("div"); row.className="cgroup";
          const gl=document.createElement("span"); gl.className="gl"; gl.textContent=BUCKET[bi]+" · "+g.length; row.appendChild(gl);
          g.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
          g.forEach(c=>row.appendChild(cardChip(c,p.index)));
          field.appendChild(row);
        });
      }
      panel.appendChild(field);

      const zl=document.createElement("div"); zl.className="zoneline";
      const gcards=(gy[p.index]||[]), ecards=(ex[p.index]||[]);
      const parts=[];
      parts.push(`<b>Graveyard</b> <span class="zn">${gcards.length}</span>` + (gcards.length?": "+gcards.map(c=>c.name).join(", "):""));
      if(ecards.length) parts.push(`<b>Exile</b> <span class="zn">${ecards.length}</span>: `+ecards.map(c=>c.name).join(", "));
      zl.innerHTML=parts.join(" &nbsp;·&nbsp; ");
      panel.appendChild(zl);

      wrap.appendChild(panel);
    });

    renderLog(s._ord);
  }

  function renderLog(curOrd){
    const box=$("log"); box.innerHTML="";
    let nowEl=null;
    for(const l of logs){
      const d=document.createElement("div");
      const past=l._ord<=curOrd;
      const isNow = past && (l._ord === lastLogOrdLE(curOrd));
      d.className="ln"+(past?" past":"")+(isNow?" now":"");
      d.innerHTML = colorize(clean(l.text), l.user);
      box.appendChild(d);
      if(isNow) nowEl=d;
    }
    if(result){ const r=document.createElement("div"); r.className="result";
      r.innerHTML = `<b>Result:</b> ${result.finalStatus||""}` + (result.winners&&result.winners.length?` — winner: <b>${result.winners.join(", ")}</b>`:"");
      box.appendChild(r);
    }
    if(nowEl) nowEl.scrollIntoView({block:"center",behavior:"smooth"});
  }
  function lastLogOrdLE(ord){ let m=-1; for(const l of logs){ if(l._ord<=ord && l._ord>m) m=l._ord; } return m; }
  function colorize(text,user){
    // MTGO log lines already start with a player token stripped by clean(); just escape.
    const esc=text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return esc;
  }

  function go(i){ idx=Math.max(0,Math.min(states.length-1,i)); render(); }
  function setPlay(on){ playing=on; $("play").textContent=on?"❚❚":"▶";
    if(timer){clearInterval(timer);timer=null;}
    if(on){ timer=setInterval(()=>{ if(idx>=states.length-1){setPlay(false);return;} go(idx+1); }, 1100); } }

  // events
  $("prev").onclick=()=>{setPlay(false);go(idx-1);};
  $("next").onclick=()=>{setPlay(false);go(idx+1);};
  $("play").onclick=()=>setPlay(!playing);
  $("slider").oninput=e=>{setPlay(false);go(+e.target.value);};
  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"){setPlay(false);go(idx-1);e.preventDefault();}
    else if(e.key==="ArrowRight"){setPlay(false);go(idx+1);e.preventDefault();}
    else if(e.key===" "){setPlay(!playing);e.preventDefault();}
  });
  $("file").onchange=e=>{ const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ parse(rd.result); $("slider").max=Math.max(0,states.length-1); go(0); }; rd.readAsText(f); };

  // boot from embedded sample
  const sample=$("sample").textContent||"";
  parse(sample);
  $("slider").max=Math.max(0,states.length-1);
  render();
})();
</script>
